name: Kisara CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Kisara APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Write google-services.json (if secret provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Code format check
        run: ./gradlew spotlessCheck

      - name: Build Kisara Preview APK
        run: |
          FLAGS="-Penable-updater --no-configuration-cache"
          if [ -f app/google-services.json ]; then
            FLAGS="$FLAGS -Pinclude-telemetry"
          fi
          ./gradlew assemblePreview $FLAGS

      - name: Sign APKs with Persistent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            find app/build/outputs/apk/ -name "*.apk" | while read -r APK_FILE; do
              $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" "$APK_FILE"
            done
            rm -f release.keystore
          fi

      - name: Package & Rename Output APKs
        id: package
        run: |
          set -e
          REF_NAME=$(echo "${GITHUB_REF}" | sed -e 's/refs\/[^\/]*\///g' | sed -e 's/[-\/]/_/g')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          RELEASE_TAG="build-r${COMMIT_COUNT}"
          mkdir -p output_apks

          find app/build/outputs/apk/ -name "*.apk" | while read -r APK_FILE; do
            BASENAME=$(basename "$APK_FILE" .apk)
            CLEAN_NAME=$(echo "$BASENAME" | sed -e 's/app-//g' | sed -e 's/-unsigned//g')
            NEW_NAME="Kisara-r${COMMIT_COUNT}-${CLEAN_NAME}.apk"
            cp "$APK_FILE" "./output_apks/$NEW_NAME"
            echo "Packaged ./output_apks/$NEW_NAME"
          done

          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kisara-apks-r${{ steps.package.outputs.COMMIT_COUNT }}
          path: ./output_apks/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, 'release:') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ./output_apks/*.apk
          tag_name: ${{ steps.package.outputs.RELEASE_TAG }}
          name: Kisara build-r${{ steps.package.outputs.COMMIT_COUNT }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
