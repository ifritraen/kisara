name: Kisara CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Kisara APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Write google-services.json (if secret provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Code format check
        run: ./gradlew spotlessCheck

      - name: Build Kisara Preview APK
        run: |
          FLAGS="-Penable-updater --no-configuration-cache"
          if [ -f app/google-services.json ]; then
            FLAGS="$FLAGS -Pinclude-telemetry"
          fi
          ./gradlew assemblePreview $FLAGS

      - name: Package & Rename Output APK
        id: package
        run: |
          set -e
          REF_NAME=$(echo "${GITHUB_REF}" | sed -e 's/refs\/[^\/]*\///g' | sed -e 's/[-\/]/_/g')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          APK_NAME="Kisara-${REF_NAME}-r${COMMIT_COUNT}.apk"
          
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "./$APK_NAME"
            echo "APK_PATH=./$APK_NAME" >> $GITHUB_OUTPUT
            echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT
            echo "Successfully packaged $APK_NAME"
          else
            echo "Error: No APK file generated." && exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.APK_NAME }}
          path: ${{ steps.package.outputs.APK_PATH }}

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.APK_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Kisara ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
