android.nonTransitiveRClass=false
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=true

org.gradle.vfs.watch=false

# 4GB heap + G1GC for R8 and fast parallel build
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin compile daemon memory for large Compose projects
kotlin.daemon.jvmargs=-Xmx4096m -Xms1024m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m

kotlin.incremental=true
kapt.incremental.apt=true
kapt.use.worker.api=true

org.gradle.workers.max=3
org.gradle.daemon.idletimeout=300000
